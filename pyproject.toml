[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcsc2kicad"
version = "1.3.0"
description = "LCSC/EasyEDA 元件 → KiCad 符号+封装+3D：Agent Skill + 命令行工具"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TP" }]
keywords = ["kicad", "lcsc", "easyeda", "eda", "pcb", "agent-skill"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
easyeda = ["easyeda2kicad>=1.0.1"]

[project.urls]
Homepage = "https://github.com/edeliris/lcsc2kicad-skill"
Issues = "https://github.com/edeliris/lcsc2kicad-skill/issues"
Changelog = "https://github.com/edeliris/lcsc2kicad-skill/releases"

[project.scripts]
lcsc2kicad = "lcsc2kicad:cli"
lcsc2kicad-build = "build_kicad_lib:cli"
lcsc2kicad-pins = "fix_symbol_pin_names:cli"
lcsc2kicad-register = "import_to_kicad:cli"
lcsc2kicad-verify = "verify_library:cli"
lcsc2kicad-models = "fix_model_paths:cli"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = [
  "lcsc2kicad",
  "build_kicad_lib",
  "fix_symbol_pin_names",
  "import_to_kicad",
  "verify_library",
  "fix_model_paths",
]
